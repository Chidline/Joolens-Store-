<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joolens Store</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#09001f,#120044,#001b4d);
  color:white;
  min-height:100vh;
}

header{
  text-align:center;
  padding:35px 15px;
  background:rgba(0,0,0,.25);
}

header h1{
  font-size:38px;
  margin:0 0 10px;
}

header p{
  color:#ccc;
  font-size:18px;
}

.box{
  max-width:600px;
  margin:auto;
  padding:25px 15px;
}

.form{
  background:rgba(255,255,255,.08);
  padding:22px;
  border-radius:20px;
  margin-bottom:25px;
}

.form label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

.form input{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  font-size:17px;
  margin-bottom:10px;
}

.item{
  background:rgba(20,0,60,.65);
  border-radius:22px;
  padding:28px 20px;
  margin-bottom:22px;
  text-align:center;
}

.item h2{
  color:#00d9ff;
  font-size:30px;
  margin:0 0 10px;
}

.price{
  font-size:25px;
  font-weight:bold;
  margin:18px 0;
}

button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:14px;
  font-size:18px;
  font-weight:bold;
  color:white;
  background:linear-gradient(90deg,#3600ff,#008cff);
}

.contact{
  display:block;
  text-align:center;
  padding:16px;
  border-radius:14px;
  background:#008000;
  color:white;
  text-decoration:none;
  font-weight:bold;
  margin-top:20px;
}

footer{
  text-align:center;
  padding:25px;
  color:#888;
}
</style>
</head>

<body>

<header>
  <h1>💎 Joolens Store</h1>
  <p>Recharge Free Fire rapidman</p>
</header>

<div class="box">

  <div class="form">
    <label for="playerId">🆔 Player ID Free Fire</label>
    <input id="playerId" type="number" placeholder="Antre Player ID ou">
  </div>

  <div class="item">
    <h2>💎 100 Diamonds</h2>
    <p>Free Fire Top-Up</p>
    <div class="price">Pri ap vini</div>

    <button onclick="order('100 Diamonds')">
      🛒 Kòmande 100 Diamonds
    </button>
  </div>

  <div class="item">
    <h2>💎 110 Diamonds</h2>
    <p>Free Fire Top-Up</p>
    <div class="price">Pri ap vini</div>

    <button onclick="order('110 Diamonds')">
      🛒 Kòmande 110 Diamonds
    </button>
  </div>

  <a class="contact"
     href="https://wa.me/50937625253">
    📲 Kontakte Joolens Store
  </a>

</div>

<footer>
  © 2026 Joolens Store
</footer>

<script>
function order(pack) {
  const playerId = document.getElementById("playerId").value.trim();

  if (!playerId) {
    alert("Tanpri antre Player ID ou anvan ou kòmande.");
    return;
  }

  const message =
    "Bonjour Joolens Store, mwen vle kòmande " +
    pack +
    ". Player ID mwen se: " +
    playerId;

  window.location.href =
    "https://wa.me/50937625253?text=" +
    encodeURIComponent(message);
}
</script>

</body>
  </html>
