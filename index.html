<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joolens Store</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #09001f, #120044, #001b4d);
  color: white;
  text-align: center;
  min-height: 100vh;
}

header {
  padding: 35px 15px;
  background: rgba(0, 0, 0, 0.25);
}

header h1 {
  font-size: 42px;
  margin: 0 0 15px;
}

header p {
  font-size: 20px;
  color: #aaa;
  margin: 0;
}

.box {
  max-width: 700px;
  margin: auto;
  padding: 30px 15px;
}

.item {
  background: rgba(20, 0, 60, 0.65);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 30px;
  padding: 40px 20px;
  margin-bottom: 30px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

.item h2 {
  color: #00d9ff;
  font-size: 38px;
  margin: 0 0 20px;
}

.item p {
  font-size: 20px;
  margin: 10px 0 25px;
}

.price {
  font-size: 34px;
  font-weight: bold;
  margin: 15px 0 25px;
}

button,
.contact {
  display: block;
  width: 90%;
  max-width: 550px;
  margin: auto;
  padding: 20px;
  border: none;
  border-radius: 25px;
  font-size: 24px;
  font-weight: bold;
  color: white;
  text-decoration: none;
  background: linear-gradient(90deg, #3600ff, #005f9e);
  cursor: pointer;
}

button:hover,
.contact:hover {
  opacity: 0.9;
}

.contact {
  background: #008000;
  margin-top: 20px;
}

footer {
  padding: 30px;
  color: #888;
  font-size: 18px;
}
</style>
</head>

<body>

<header>
  <h1>💎 Joolens Store</h1>
  <p>Recharge Free Fire rapidman</p>
</header>

<div class="box">

  <div class="item">
    <h2>💎 100 Diamonds</h2>
    <p>Free Fire Top-Up</p>
    <div class="price">Pri ap vini</div>

    <a href="https://wa.me/50937625253?text=Bonjour%20Joolens%20Store%2C%20mwen%20vle%20k%C3%B2mande%20100%20Diamonds">
      <button>🛒 Kòmande</button>
    </a>
  </div>

  <div class="item">
    <h2>💎 110 Diamonds</h2>
    <p>Free Fire Top-Up</p>
    <div class="price">Pri ap vini</div>

    <a href="https://wa.me/50937625253?text=Bonjour%20Joolens%20Store%2C%20mwen%20vle%20k%C3%B2mande%20110%20Diamonds">
      <button>🛒 Kòmande</button>
    </a>
  </div>

  <a class="contact"
     href="https://wa.me/50937625253?text=Bonjour%20Joolens%20Store%2C%20mwen%20ta%20renmen%20kontakte%20nou">
    📲 Kontakte Joolens Store

</div>

<footer>

</footer>

</html>
