<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>💎 Joolens Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #09001a, #16003b, #001b3d);
      color: white;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 35px 15px;
      background: rgba(0, 0, 0, 0.35);
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    header p {
      color: #ddd;
      font-size: 16px;
    }

    .container {
      width: 92%;
      max-width: 600px;
      margin: 30px auto;
    }

    .item {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .item h2 {
      color: #00eaff;
      margin-bottom: 12px;
      font-size: 24px;
    }

    .item p {
      color: #ddd;
      margin-bottom: 18px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 25px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: linear-gradient(90deg, #7b2cff, #00c6ff);
      cursor: pointer;
    }

    button:active {
      transform: scale(0.96);
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>💎 Joolens Store</h1>
    <p>Recharge Free Fire rapidman</p>
  </header>

  <div class="container">

    <div class="item">
      <h2>💎 100 Diamonds</h2>
      <p>Chwazi opsyon sa a pou kòmande.</p>
      <button onclick="commande('100 Diamonds')">
        Kòmande
      </button>
    </div>

    <div class="item">
      <h2>💎 110 Diamonds</h2>
      <p>Disponib pou recharge.</p>
      <button onclick="commande('110 Diamonds')">
        Kòmande
      </button>
    </div>

  </div>

  <footer>
    © 2026 Joolens Store
  </footer>

  <script>
    function commande(pack) {
      alert("Ou chwazi " + pack + ". Kontakte Joolens Store pou finalize kòmand lan.");
    }
  </script>

</body>
</html>
